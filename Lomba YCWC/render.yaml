services:
  - type: web
    name: cooklens
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DETECTOR_MODE
        value: mock
      - key: VISION_MODEL
        value: gpt-4o-mini
      - key: VISION_API_KEY
        sync: false
