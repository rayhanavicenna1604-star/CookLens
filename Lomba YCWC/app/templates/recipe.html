<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recipe | CookLens</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body>
  <header class="site-header"><a class="brand" href="/">CookLens</a><nav><a href="/">Home</a><a href="/scan">Scan food</a><a class="active" href="/recipes">Recipes</a></nav><a class="header-action" href="/scan">New scan <span>↗</span></a></header>
  <main class="detail-main" id="recipeDetail"><div class="loading-state"><div class="spinner"></div><h2>Setting the table...</h2></div></main>
  <script>
    fetch('/api/recipes/{{ recipe_id }}').then(r=>r.json()).then(r=>{document.querySelector('#recipeDetail').innerHTML=`<a class="back-link" href="/recipes">Back to all recipes</a><div class="detail-hero"><div class="detail-visual" style="background-image:linear-gradient(90deg,#17231e66,#17231e11),url('${r.image_url}')"></div><div><p class="eyebrow">A CookLens original</p><h1>${r.name}</h1><p class="detail-description">${r.description}</p><div class="stats"><span><b>${r.compatibility}%</b> match</span><span><b>${r.cooking_time}</b> min</span><span><b>${r.servings}</b> servings</span><span><b>${r.difficulty}</b> difficulty</span><span><b>~Rp ${r.estimated_additional_cost.toLocaleString('id-ID')}</b> extra ingredients</span></div></div></div><div class="detail-grid"><section><h2>What you'll need</h2><ul class="detail-list">${r.ingredients.map(i=>`<li class="${r.available_ingredients.includes(i)?'available':''}"><span>${r.available_ingredients.includes(i)?'Confirmed':'Missing'}</span>${i}</li>`).join('')}</ul>${r.substitution?`<div class="tip"><b>Easy swap</b><br>${r.substitution}</div>`:''}<p class="price-note">Estimated from typical Indonesian retail prices. Actual cost depends on location, brand, package size, and what you already have.</p></section><section><h2>Make it</h2><ol class="instructions">${r.instructions.map(i=>`<li>${i}</li>`).join('')}</ol><div class="waste-score"><span>WASTE</span><div><b>Food waste score: ${r.food_waste_score}/100</b><small>This recipe puts your available ingredients to work.</small></div></div></section></div><section class="feedback"><h2>How was your rescue?</h2><button data-rating="great">Great</button><button data-rating="okay">Okay</button><button data-rating="not-good">Not good</button><p id="feedbackMessage"></p></section>`;document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipe_id:r.id,rating:b.dataset.rating})}).then(x=>x.json()).then(x=>document.querySelector('#feedbackMessage').textContent=x.message))})
  </script>
</body>
</html>
